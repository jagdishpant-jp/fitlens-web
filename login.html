<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>FitLens · Log in</title>
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="app-head"><div class="wrap">
    <h1>Log <em>in</em></h1>
    <p class="sub">Choose how you want to use FitLens.</p>
  </div></section>
  <section class="app-body"><div class="wrap">
    <p id="notice" class="notice" hidden></p>
    <div class="role-grid">
      <button class="role-card client" data-role="client" type="button">
        <span class="role-label">Client</span>
        <span><h2 id="clientName">Client</h2><p>Upload progress photos and form-check videos, read your coach’s feedback and track your journey.</p></span>
        <span class="go">Continue as client <span aria-hidden="true">→</span></span>
      </button>
      <button class="role-card coach" data-role="coach" type="button">
        <span class="role-label">Coach</span>
        <span><h2 id="coachName">Coach</h2><p>Review your client’s timeline, leave coaching comments and compare their first and latest week.</p></span>
        <span class="go">Continue as coach <span aria-hidden="true">→</span></span>
      </button>
    </div>
    <p class="demo-note" style="margin-top:1.5rem">Demo sign-in for this prototype: roles are selected rather than authenticated. A production version would use Microsoft Entra ID sign-in, as described in the project’s limitations.</p>
  </div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/login.js"></script>
</body>
</html>
