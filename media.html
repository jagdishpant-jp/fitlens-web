<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>FitLens · Upload details</title>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">FitLens</a>
  <nav>
    <a href="index.html" aria-current="page">Timeline</a>
    <a href="upload.html" >Upload</a>
  </nav>
</header>
<main class="page">
  <a class="back" href="index.html">Back to timeline</a>
  <h1 id="title">Loading…</h1>
  <p id="notice" class="notice" hidden></p>

  <div class="detail">
    <div>
      <div class="viewer" id="viewer"></div>
      <ul class="facts" id="facts"></ul>
      <p class="private">Private file, shown through a link that expires after 15 minutes.</p>
    </div>

    <form class="panel" id="editForm">
      <h2>Edit details</h2>
      <label class="field">Caption
        <input name="caption" maxlength="120">
      </label>
      <label class="field">Coach comment
        <textarea name="comment" rows="5" placeholder="Feedback from your coach"></textarea>
      </label>
      <div class="panel-actions">
        <button class="btn btn-primary" id="saveBtn" type="submit">Save changes</button>
        <button class="btn btn-danger-outline" id="deleteBtn" type="button">Delete</button>
      </div>
      <p class="meta" id="edited"></p>
    </form>
  </div>
</main>

<dialog id="deleteDialog">
  <h2>Delete this upload?</h2>
  <p>The file and its details will be permanently removed for you and your coach. This can’t be undone.</p>
  <div class="dialog-actions">
    <button class="btn btn-outline" id="cancelDelete" type="button">Cancel</button>
    <button class="btn btn-danger" id="confirmDelete" type="button">Delete</button>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/media.js"></script>
</body>
</html>
