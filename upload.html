<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>FitLens · Add a check-in</title>
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="app-head"><div class="wrap">
    <h1>Add a <em>check-in</em></h1>
    <p class="sub" id="who"></p>
  </div></section>
  <section class="app-body"><div class="wrap" style="max-width:780px">
    <p id="notice" class="notice" hidden></p>
    <div class="form-card">
      <form id="uploadForm" novalidate>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*,video/*">
          <span class="drop-title">Drop a photo or video here</span>
          <span class="drop-hint">or click to browse · JPG, PNG or MP4</span>
        </label>
        <div class="file-chip" id="fileChip" hidden>
          <div class="preview" id="preview"></div>
          <div class="file-meta"><strong id="chipName"></strong><span id="chipSize"></span>
            <div class="bar-track"><div class="bar-fill" id="barFill"></div></div></div>
          <span class="pct" id="pct"></span>
        </div>
        <div class="field-row">
          <label class="field grow">Caption<input name="caption" maxlength="120" placeholder="e.g. Week 6 squat depth"></label>
          <label class="field week">Week<input name="week" id="week" type="number" min="1" max="52" value="1"></label>
        </div>
        <fieldset class="field"><legend>Type</legend>
          <div class="segmented">
            <label><input type="radio" name="mediaType" value="photo" checked><span>Photo</span></label>
            <label><input type="radio" name="mediaType" value="video"><span>Video</span></label>
          </div>
        </fieldset>
        <label class="field">Share with<select><option id="coachOption">My coach</option></select></label>
        <div class="form-foot">
          <p class="private"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Only you and your coach can see this.</p>
          <button class="btn btn-black" id="submitBtn" type="submit">Upload <span class="arrow">→</span></button>
        </div>
      </form>
    </div>
  </div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
