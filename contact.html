<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>FitLens · Contact</title>
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="section-dark">
    <div class="wrap contact-grid">
      <div>
        <h1 class="big-title">Get in touch</h1>
        <p class="lead">Questions about FitLens, coaching accounts or your data? Send us a message.</p>
        <ul class="info-list">
          <li><b>Email</b><a href="mailto:hello@fitlens.example">hello@fitlens.example</a></li>
          <li><b>Based in</b>Belfast, Northern Ireland</li>
          <li><b>Data requests</b>To delete your data, use Delete on any check-in or email us.</li>
        </ul>
      </div>
      <form class="form-card lime-card" id="contactForm" novalidate>
        <p id="notice" class="notice" hidden></p>
        <div class="field-row">
          <label class="field grow">First name *<input name="first" required autocomplete="given-name"></label>
          <label class="field grow">Last name *<input name="last" required autocomplete="family-name"></label>
        </div>
        <label class="field">Email *<input name="email" type="email" required autocomplete="email"></label>
        <label class="field">I am a
          <select name="who"><option>Client</option><option>Coach</option><option>Gym or studio</option><option>Other</option></select>
        </label>
        <label class="field">Message *<textarea name="message" rows="4" required></textarea></label>
        <div class="form-foot">
          <p class="private">Opens your email app with the message ready to send.</p>
          <button class="btn btn-black" type="submit">Send message <span class="arrow">→</span></button>
        </div>
      </form>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
