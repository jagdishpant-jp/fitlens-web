# FitLens CI/CD with GitHub Actions
# CI: on every push and pull request, check the site and build it.
# CD: on every push to main, deploy the site to the Azure Storage static website ($web).
# API URLs and the storage connection string come from GitHub Secrets, never from the code.

name: FitLens CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in index.html login.html dashboard.html upload.html media.html contact.html privacy.html 404.html css/style.css js/api.js js/layout.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          echo "All required files are present"

      - name: Check JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done
          echo "JavaScript syntax OK"

      - name: Create config.js from GitHub Secrets
        env:
          IUPS_URL: ${{ secrets.IUPS_URL }}
          RAI_URL: ${{ secrets.RAI_URL }}
          RIPS_URL: ${{ secrets.RIPS_URL }}
          UIPS_URL: ${{ secrets.UIPS_URL }}
          DIPS_URL: ${{ secrets.DIPS_URL }}
          INSIGHTS_URL: ${{ secrets.INSIGHTS_URL }}
          TRANSLATE_URL: ${{ secrets.TRANSLATE_URL }}
        run: |
          cat > js/config.js <<EOF
          // Generated by GitHub Actions from repository secrets. Do not commit this file.
          const FITLENS_CONFIG = {
            IUPS_URL: "${IUPS_URL}",
            RAI_URL: "${RAI_URL}",
            RIPS_URL: "${RIPS_URL}",
            UIPS_URL: "${UIPS_URL}",
            DIPS_URL: "${DIPS_URL}",
            INSIGHTS_URL: "${INSIGHTS_URL}",
            TRANSLATE_URL: "${TRANSLATE_URL}",
            TRAINER_ID: "tr-042",
            TRAINER_NAME: "Jagdish Pant",
            CLIENT_ID: "cl-1187",
            CLIENT_NAME: "Rajesh Pant"
          };
          EOF
          node --check js/config.js
          echo "config.js created"

      - name: Package the website
        run: |
          mkdir site
          cp *.html site/
          cp -r css js img site/
          echo "Files in build:"
          find site -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlens-site
          path: site
          retention-days: 7

  deploy:
    name: Deploy to Azure static website
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fitlens-site
          path: site

      - name: Upload to the $web container
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload-batch \
            --destination '$web' \
            --source site \
            --overwrite \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --output table
          echo "Live at https://fitlensmediajp.z28.web.core.windows.net/"